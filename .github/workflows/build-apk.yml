name: APK Derle

on:
  workflow_dispatch:          # Actions sekmesinden elle başlatmak için
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev lld

      - name: Buildozer kur
        run: |
          pip install --upgrade pip
          pip install buildozer "Cython<3.1" setuptools virtualenv

      - name: Önbellek (2. derlemeden sonra çok hızlanır)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}

      - name: APK derle
        working-directory: android
        run: yes | buildozer -v android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: DWvideos-apk
          path: android/bin/*.apk
